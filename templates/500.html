<!DOCTYPE html>
<!--
  Standalone 500 error page.
  Must NOT use any Django template tags — no extends, no url, no static,
  no translate. The 500 handler renders with an empty context and context
  processors / DB / i18n machinery may be unavailable. Critical styles live in
  /static/css/500.css so the page reads intentionally even if output.css fails
  to load.
  Both English and French copy are hard-coded.
-->
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Server error &middot; Ski Parrainage</title>
        <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
        >
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        >
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Hanken+Grotesk:wght@400;600&display=swap"
            rel="stylesheet"
        >
        {% comment %}
        Progressive enhancement: output.css is linked but the page is fully
        readable without it via the critical styles below.
        {% endcomment %}
        <link rel="stylesheet" href="/static/css/output.css">
        {% comment %}
        Critical styles as a static file, not an inline <style> block: the CSP
        allows style-src 'self' but no inline styles, and the hash that used to
        whitelist the block does not survive django-csp-plus's value
        normalisation (SKI-170). A separate file from output.css on purpose —
        this page must still read correctly when the Tailwind build is what
        broke.
        {% endcomment %}
        <link rel="stylesheet" href="/static/css/500.css">
    </head>
    <body>
        <div class="container">
            <div class="glyph" aria-hidden="true">
                <svg width="40" height="40" viewBox="0 0 22 22" fill="none">
                    <path
                        d="M11 3.5 L18.5 18 L3.5 18 Z"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M8.4 12.8 L11 8.2 L13.6 12.8"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                    />
                </svg>
            </div>
            <p class="code">500</p>
            <h1>Something went wrong</h1>
            <p class="sub">We hit an unexpected error. Try again in a moment.</p>
            <hr class="divider">
            <p class="sub">Une erreur inattendue s'est produite. Réessayez dans un instant.</p>
            <a href="/" class="link">Back to home / Retour à l'accueil</a>
        </div>
    </body>
</html>
